[project]
name = "infra-change-evidence-lab"
version = "1.0.0"
description = "Deterministic change-risk validation and audit evidence for synthetic IT infrastructure"
requires-python = ">=3.11"

[project.scripts]
infra-change = "infra_change_evidence.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
