name: Deploy portfolio site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/index.html"
      - "site/styles.css"
      - "site/fonts/**"
      - "site/serve.mjs"
      - "site/test.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 준비
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: 포맷과 공개 자산 경계 검증
        run: |
          npm ci --ignore-scripts
          npm run format:check
          npm test
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build allowlisted static site
        run: |
          mkdir -p _site
          cp site/index.html site/styles.css _site/
          mkdir -p _site/fonts
          cp site/fonts/PretendardVariable.woff2 site/fonts/OFL.txt _site/fonts/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
